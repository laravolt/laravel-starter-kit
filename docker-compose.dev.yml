# Laravolt v7 starter-kit — development stack.
# SQLite-backed quickstart with the source tree mounted into the container.
# Run:
#   docker compose -f docker-compose.dev.yml up --build
# Then open http://localhost:8000 ; Vite dev server (when started inside the
# container with `npm run dev`) is exposed on http://localhost:5173.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/dev.Dockerfile
    image: laravolt-starter-kit:dev
    container_name: laravolt-starter-kit-dev
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache

  # Optional: run `vite` in a side-car if you don't want it inside the app
  # container. Enable by uncommenting and ensuring node_modules is built.
  # vite:
  #   image: node:24-alpine
  #   working_dir: /app
  #   command: ["npm", "run", "dev", "--", "--host"]
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - .:/app

volumes:
  composer-cache:
